<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f4f0e8" /><meta name="robots" content="noindex,nofollow" />
  <title>Write · F4M1LY News</title><link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="news.css?v=2" /><link rel="stylesheet" href="editor.css?v=1" />
  <script src="editor.js?v=1" defer></script>
</head>
<body>
  <header class="article-nav"><a href="index.html">← News</a><a href="../index.html">F4M1LY</a></header>
  <main class="editor-shell">
    <section class="editor-intro"><p class="kicker">F4M1LY NEWSROOM</p><h1>Write a story.</h1><p>Create a draft, preview the details and publish it directly to the News page.</p></section>
    <section class="login-panel" id="loginPanel">
      <form id="loginForm"><label for="editorPassword">Editor password</label><div><input id="editorPassword" type="password" autocomplete="current-password" required /><button type="submit">Enter newsroom</button></div><p id="loginStatus" role="status"></p></form>
    </section>
    <section class="editor-workspace" id="editorWorkspace" hidden>
      <form class="story-form" id="storyForm">
        <input id="articleId" type="hidden" />
        <div class="field wide"><label for="articleTitle">Headline</label><input id="articleTitle" maxlength="160" required placeholder="Write a clear headline" /></div>
        <div class="field wide"><label for="articleSummary">Summary</label><textarea id="articleSummary" maxlength="420" required rows="3" placeholder="A short introduction for the News page"></textarea></div>
        <div class="field"><label for="articleTopic">Topic</label><select id="articleTopic"><option>Family</option><option>Games</option><option>Learning</option><option>Tools</option></select></div>
        <div class="field"><label for="articleLabel">Label</label><input id="articleLabel" maxlength="80" placeholder="NEWS · OCTOBER 2026" /></div>
        <div class="field wide"><label for="articleImage">Header image URL <span>optional, HTTPS only</span></label><input id="articleImage" type="url" placeholder="https://…" /></div>
        <div class="field wide"><label for="articleBody">Article</label><textarea id="articleBody" required rows="18" placeholder="Write your article here. Leave one empty line between paragraphs."></textarea></div>
        <label class="check-field"><input id="articleFeatured" type="checkbox" /> Make this a large featured story</label>
        <div class="publish-row"><button class="secondary-button" id="saveDraft" type="button">Save draft</button><button class="publish-button" type="submit">Publish</button><button class="text-button" id="clearForm" type="button">New blank story</button><p id="editorStatus" role="status"></p></div>
      </form>
      <aside class="story-library"><div class="library-heading"><div><p class="kicker">YOUR STORIES</p><h2>Drafts &amp; published</h2></div><button id="refreshStories" type="button">Refresh</button></div><div id="editorStories"><p class="loading-message">Loading…</p></div></aside>
    </section>
  </main>
</body>
</html>
