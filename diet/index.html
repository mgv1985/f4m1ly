<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6ef">
  <title>Diet · Personal meal diary</title>
  <link rel="stylesheet" href="diet.css?v=6">
</head>
<body>
  <div class="gate" id="gate">
    <form class="gate-card" id="gate-form">
      <p class="eyebrow">PERSONAL MEAL DIARY</p>
      <h1>Diet</h1>
      <p>Enter the password to open your meal plan.</p>
      <label for="password">Password</label>
      <div class="password-row">
        <input id="password" type="password" inputmode="numeric" autocomplete="current-password" required autofocus>
        <button type="submit">Enter</button>
      </div>
      <p class="gate-error" id="gate-error" role="alert"></p>
    </form>
  </div>

  <div class="app" id="app" hidden>
    <header class="site-header">
      <a class="brand" href="../index.html" aria-label="Αρχική σελίδα">
        <span class="brand-mark">D</span>
        <span><b>Diet</b><small>Personal meal diary</small></span>
      </a>
      <button class="quiet-button" id="lock-button" type="button">Lock</button>
    </header>

    <nav class="tabs" aria-label="Main navigation">
      <button class="tab active" data-tab="today" type="button">Today</button>
      <button class="tab" data-tab="history" type="button">History</button>
      <button class="tab" data-tab="portions" type="button">Portions</button>
    </nav>

    <main>
      <section class="panel active" id="today-panel">
        <div class="page-heading">
          <div>
            <p class="eyebrow" id="today-weekday"></p>
            <h2 id="today-date">Today</h2>
          </div>
        </div>
        <div class="meal-list" id="today-meals"></div>
        <div class="save-day-bar">
          <p id="save-status" role="status">Select one option for every meal, then save your day.</p>
          <button id="save-day" type="button">OK · Save today</button>
        </div>
      </section>

      <section class="panel" id="history-panel" hidden>
        <div class="page-heading"><div><p class="eyebrow">YOUR SAVED DAYS</p><h2>History</h2></div></div>
        <p class="intro">Each day appears here only after you press “OK · Save today”.</p>
        <p class="cloud-status" id="history-status" role="status"></p>
        <div class="history-list" id="history-list"></div>
      </section>

      <section class="panel" id="portions-panel" hidden>
        <div class="page-heading"><div><p class="eyebrow">QUICK REFERENCE</p><h2>Portions</h2></div></div>
        <div id="portions-content"></div>
      </section>
    </main>
  </div>
  <script src="diet.js?v=6"></script>
</body>
</html>
