<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3ead8" />
  <title>Timer | f4m1ly</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=5" />
  <link rel="stylesheet" href="timer.css?v=7" />
</head>
<body class="timer-page">
  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="Back to the main page"><span class="mark" aria-hidden="true">✦</span><span>Timer</span></a>
    <nav class="header-actions" aria-label="Main navigation">
      <a class="game-link" href="index.html">Main page</a>
      <a class="game-link" href="archive.html?v=3">Family archive</a>
      <a class="game-link" href="The Pool of Memory/index.html?v=3">Pool of Memory</a>
      <a class="game-link" href="sudoku game/index.html?v=13">Gridline</a>
    </nav>
  </header>

  <main class="time-main">
    <p class="time-tagline">keep on time</p>

    <section class="time-grid" aria-label="Time tools">
      <article class="time-card clock-card">
        <div class="card-heading"><h2>Clock</h2></div>
        <div class="local-clock-line"><output class="clock-display" id="clockTime">--:--:--</output><span id="localClockInfo"></span></div>
        <p id="clockDate">Loading date…</p>
        <div class="world-clock-compose">
          <input id="clockLocation" type="search" maxlength="60" aria-label="City, town, or country" placeholder="City, town, or country" />
          <button class="time-button" id="addClock" type="button">Add time</button>
        </div>
        <p class="time-status" id="clockStatus" role="status"></p>
        <div class="world-clock-list" id="worldClockList" aria-label="Saved world clocks"></div>
      </article>

      <article class="time-card">
        <div class="card-heading"><h2>Alarm</h2></div>
        <div class="alarm-compose">
          <label><span>Time</span><input id="alarmTime" type="time" step="60" /></label>
          <label class="note-field"><span>Note</span><input id="alarmNote" type="text" maxlength="24" /></label>
          <button class="time-button primary add-time" id="setAlarm" type="button">Add</button>
        </div>
        <p class="time-status" id="alarmStatus" role="status"></p>
        <div class="time-list" id="alarmList" aria-label="Active alarms"></div>
      </article>

      <article class="time-card">
        <div class="card-heading"><h2>Timer</h2></div>
        <div class="timer-compose">
          <div class="duration-inputs">
            <label><span>Hr</span><input id="timerHours" type="number" min="0" max="99" value="0" inputmode="numeric" /></label>
            <label><span>Min</span><input id="timerMinutes" type="number" min="0" max="59" value="5" inputmode="numeric" /></label>
            <label><span>Sec</span><input id="timerSeconds" type="number" min="0" max="59" value="0" inputmode="numeric" /></label>
          </div>
          <label class="note-field"><span>Note</span><input id="timerNote" type="text" maxlength="24" /></label>
          <button class="time-button primary add-time" id="timerStart" type="button">Start</button>
        </div>
        <p class="time-status" id="timerStatus" role="status"></p>
        <div class="time-list" id="timerList" aria-label="Active timers"></div>
      </article>

      <article class="time-card stopwatch-card">
        <div class="card-heading"><h2>Stopwatch</h2></div>
        <output class="stopwatch-display" id="stopwatchDisplay">00:00:00.0</output>
        <p class="time-status" id="stopwatchStatus" role="status">Ready to start.</p>
        <div class="time-actions"><button class="time-button primary" id="stopwatchToggle" type="button">Start</button><button class="time-button" id="stopwatchReset" type="button">Reset</button></div>
      </article>
    </section>
  </main>

  <footer><p>Made with care for the people we love.</p><p>TIME / F4M1LY</p></footer>

  <dialog class="ring-dialog" id="ringDialog">
    <p class="eyebrow">TIME IS UP</p>
    <h2 id="ringTitle">Alarm</h2>
    <p id="ringMessage">Your alarm is ringing.</p>
    <button class="time-button primary" id="ringStop" type="button">Stop</button>
  </dialog>
  <script src="timer.js?v=6"></script>

  <!-- End Cloudflare Web Analytics -->
</body>
</html>
