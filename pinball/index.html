<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07100b" />
  <meta name="description" content="Temple Quest, a jungle adventure pinball game." />
  <title>Temple Quest · Pinball</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Manrope:wght@500;600;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=1" />
</head>
<body>
  <header class="game-header">
    <a class="brand" href="../index.html"><span aria-hidden="true">✦</span><strong>Temple Quest</strong></a>
    <nav aria-label="Main navigation">
      <a href="../index.html">Main page</a>
      <a href="../The Pool of Memory/index.html?v=3">Pool of Memory</a>
      <a href="../sudoku game/index.html?v=13">Gridline</a>
      <a href="../counting/index.html">Couning</a>
      <a href="../timer.html?v=6">Timer</a>
      <a href="../archive.html?v=3">Family archive</a>
    </nav>
  </header>

  <main class="game-shell">
    <section class="score-panel" aria-label="Game status">
      <p class="kicker">Jungle pinball</p>
      <h1>Temple<br />Quest</h1>
      <dl>
        <div><dt>Score</dt><dd id="score">000000</dd></div>
        <div><dt>Best</dt><dd id="best">000000</dd></div>
        <div><dt>Balls</dt><dd id="balls">● ● ●</dd></div>
      </dl>
      <p class="status" id="status">Loading the temple…</p>
      <div class="launch-meter" aria-label="Launch power"><span id="launchMeter"></span></div>
      <button class="start-button" id="startButton" type="button" disabled>Start expedition</button>
      <div class="instructions">
        <p><kbd>A</kbd> / <kbd>←</kbd> Left flipper</p>
        <p><kbd>D</kbd> / <kbd>→</kbd> Right flipper</p>
        <p><kbd>Space</kbd> Launch ball</p>
      </div>
    </section>

    <div class="table-wrap" id="tableWrap">
      <canvas id="pinball" width="900" height="1500" aria-label="Jungle temple pinball table"></canvas>
      <div class="loading" id="loading">Awakening the temple…</div>
    </div>

    <div class="touch-controls" aria-label="Pinball controls">
      <button id="leftControl" type="button" aria-label="Left flipper">◀</button>
      <button id="launchControl" type="button" aria-label="Launch ball">LAUNCH</button>
      <button id="rightControl" type="button" aria-label="Right flipper">▶</button>
    </div>
  </main>

  <script type="module" src="game.js?v=2"></script>
  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"0ce505fb0b8c4a2399dd96c0189b03b1"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
